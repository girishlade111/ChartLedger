services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chartledger
      POSTGRES_PASSWORD: change_me_local_dev
      POSTGRES_DB: chartledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      SQL_HOST: db
      SQL_PORT: 5432
      SQL_USER: chartledger
      SQL_PASSWORD: change_me_local_dev
      SQL_DB_NAME: chartledger
      JWT_SECRET: replace_with_32_byte_random_secret
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}

volumes:
  pgdata:
